name: Product validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - run: uv sync --frozen --python 3.11.15 --extra demo --extra test --extra tuning --extra trees
      - run: uvx --from ruff==0.12.12 ruff check --select E9,F63,F7,F82 src scripts tests
      - run: uv run --no-sync python scripts/public_audit.py
      - run: uv run --no-sync pytest -q
      - run: uv build --wheel
      - run: docker compose config --quiet && docker build -t phishshield-ci .
      - name: Verify isolated collector startup
        run: |
          docker compose -f compose.yaml -f compose.fullscan.yaml config --quiet
          docker compose -f compose.fetcher.yaml up --build -d
          curl --retry 20 --retry-all-errors --retry-delay 1 --max-time 4 -fsS http://127.0.0.1:18731/health -o "$RUNNER_TEMP/collector-health.json"
          python -c "import json,sys; assert json.load(open(sys.argv[1]))['confinement']=='active'" "$RUNNER_TEMP/collector-health.json"
      - if: failure()
        run: docker compose -f compose.fetcher.yaml logs --tail 40
      - if: always()
        run: docker compose -f compose.fetcher.yaml down
